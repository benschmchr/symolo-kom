{% extends "kern/base.html" %}
{% block titel %}Passwort ändern{% endblock %}
{% block inhalt %}
<h1>Passwort ändern</h1>
<div class="karte formular">
  <form method="post">{% csrf_token %}
    {% for f in form %}
    <div class="feld"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}
      {% for e in f.errors %}<span class="fehlertext">{{ e }}</span>{% endfor %}</div>
    {% endfor %}
    <p class="klein leise">Mindestens 10 Zeichen, nicht nur Ziffern.</p>
    <button class="knopf-haupt" type="submit">Speichern →</button>
  </form>
</div>
{% endblock %}
