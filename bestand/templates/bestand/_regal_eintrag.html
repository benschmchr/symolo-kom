{# Ein Eintrag im Regal oder in den Listen darunter (R-R1, R-R4). Rolle Kommissionierung: antippen oder ziehen = Platz ändern (R-R5) #}
{% if darf_mengen %}<span role="button" tabindex="0" class="eintrag {{ x.css }}" data-platz-auf data-bgs="{{ x.bgs }}" data-art="{{ x.bg_id|yesno:'bg,ab' }}" data-id="{% if x.bg_id %}{{ x.bg_id }}{% else %}{{ x.ab_id }}{% endif %}" data-name="{{ x.name }}" data-platz="{{ x.platz }}" data-ab="{{ x.ab_anzeige }}" data-ab-id="{{ x.ab_id }}" draggable="true" title="{{ x.name }}: {{ x.status }}" aria-label="{{ x.name }}, {{ x.status }}{% if x.platz %}, Platz {{ x.platz }}{% endif %}">{{ x.name }}{% if mit_platz %}<span class="eintrag-platz">· {{ x.platz }}</span>{% endif %}</span>{% else %}<a class="eintrag {{ x.css }}" href="{% url 'bestandsliste' %}?q={{ x.ab_anzeige|urlencode }}" title="{{ x.name }}: {{ x.status }}" aria-label="{{ x.name }}, {{ x.status }}">{{ x.name }}{% if mit_platz %}<span class="eintrag-platz">· {{ x.platz }}</span>{% endif %}</a>{% endif %}
