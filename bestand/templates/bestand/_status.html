{# Statuszelle: Wort + Bedeutungsfarbe. Teile: für Lager antippbar (R-M2). Parameter: z, teil_url; für AB/BG zusätzlich alles_url (+ alles_bg, alles_name, alles_anzahl, alles_ref): Antippen = alles ✓ (R-M3) #}
{% if teil_url %}<button type="button" class="status {{ z.w.css }} status-knopf" data-feld="status" data-umschalten="{{ teil_url }}" title="Antippen: Vorhanden = Soll (bei Komplett: 0)">{{ z.w.status }}</button>{% elif alles_url %}<button type="button" class="status {{ z.w.css }} status-knopf" data-feld="status" data-alles="{{ alles_url }}"{% if alles_bg %} data-bg="{{ alles_bg }}"{% endif %} data-name="{{ alles_name }}" data-anzahl="{{ alles_anzahl }}" data-zeile-ref="{{ alles_ref }}" title="Antippen: alle Teile auf Soll setzen (bei Komplett: auf 0)">{{ z.w.status }}</button>{% else %}<span class="status {{ z.w.css }}" data-feld="status">{{ z.w.status }}</span>{% endif %}
